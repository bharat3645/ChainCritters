name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # BlockChain/.github/workflows/*.yml already defines Foundry CI, but GitHub
  # Actions only ever reads workflows from the *repo root* .github/workflows —
  # since BlockChain is a plain subdirectory of this repo (not its own repo),
  # those workflows have never actually run. This job is the equivalent
  # build+test check, wired up so it finally executes on every push/PR.
  blockchain:
    name: BlockChain (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BlockChain
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vvv

  db:
    name: Backend/db
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/db/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  http:
    name: Backend/http
    runs-on: ubuntu-latest
    needs: db
    defaults:
      run:
        working-directory: Backend/http
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/http/package-lock.json
      - name: Install db dependency (generates Prisma client the http build imports)
        working-directory: Backend/db
        run: npm ci && npx prisma generate && npm run build
      - run: npm ci
      - run: npm run build
      - run: npm test

  websockets:
    name: Backend/WebSockets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/WebSockets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/WebSockets/package-lock.json
      - run: npm ci
      - run: npx tsc -b

  frontend:
    name: chaincritters-web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaincritters-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chaincritters-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
