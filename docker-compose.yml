name: chaincritters

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaincritters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaincritters}
      POSTGRES_DB: ${POSTGRES_DB:-chaincritters}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chaincritters} -d ${POSTGRES_DB:-chaincritters}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies Prisma migrations then exits. http waits for this to
  # succeed before it starts.
  migrate:
    build:
      context: ./Backend/db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaincritters}:${POSTGRES_PASSWORD:-chaincritters}@postgres:5432/${POSTGRES_DB:-chaincritters}
    depends_on:
      postgres:
        condition: service_healthy

  websockets:
    build:
      context: ./Backend/WebSockets
    restart: unless-stopped
    environment:
      PORT: 8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "8080:8080"

  http:
    build:
      context: .
      dockerfile: Backend/http/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaincritters}:${POSTGRES_PASSWORD:-chaincritters}@postgres:5432/${POSTGRES_DB:-chaincritters}
      WS_HTTP_URL: http://websockets:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      websockets:
        condition: service_started

  frontend:
    build:
      context: ./chaincritters-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - http
      - websockets

volumes:
  pgdata:
